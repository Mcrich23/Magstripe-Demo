<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Magstripe Reader</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><div>Magstripe Reader</div></header>
  <main>
    <section class="card status-card" aria-label="Reader status">
      <svg class="card-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="4"/><path d="M3 12h26M8 20h6"/></svg>
      <div><h1 id="status" role="status" aria-live="polite">Ready for a swipe</h1><p id="reader-note">Keep this window active. Swipes appear automatically.</p></div>
    </section>

    <section id="empty-state" class="card empty-state" aria-label="Waiting for a swipe">
      <svg viewBox="0 0 48 40" fill="none" aria-hidden="true"><rect x="3" y="5" width="42" height="30" rx="5"/><path d="M3 15h42M10 27h9"/></svg>
      <h2>Swipe a card</h2><p>That’s all. Your card’s information will appear here.</p>
    </section>

    <section id="result-card" class="card" aria-labelledby="result-title" hidden>
      <h2 id="result-title">Last swipe</h2>
      <dl id="fields" class="fields"></dl>
      <p id="read-note" class="read-note" hidden></p>
      <dl id="extra-fields" class="fields extra-fields"></dl>
    </section>

    <p class="privacy-note"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="9" width="12" height="9" rx="2"/><path d="M6.5 9V6a3.5 3.5 0 0 1 7 0v3"/></svg><span>Card numbers are masked. Nothing is saved or sent. <span id="countdown">Swipes clear after 15 seconds.</span></span></p>
  </main>
  <noscript>This demo needs JavaScript enabled. It runs entirely in your browser.</noscript>
</body>
</html>
